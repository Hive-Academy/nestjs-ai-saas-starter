<section
  class="w-full min-h-screen bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-800 relative overflow-auto"
>
  <div #ecosystemCanvas class="absolute inset-0 opacity-20"></div>
  <div class="relative z-10 p-8">
    <div class="text-center mb-12">
      <h2 class="text-4xl font-bold text-white">Library Ecosystem</h2>
      <p class="text-lg text-white/80">
        Enterprise-grade modular architecture with
        {{ libraryCount }} specialized libraries
      </p>
    </div>

    <div class="max-w-7xl mx-auto space-y-8">
      <div
        *ngFor="let category of getLibraryCategories(); trackBy: trackByName"
        class="bg-black/20 backdrop-blur-lg rounded-2xl border border-white/10 p-6"
      >
        <h3 class="text-2xl font-bold text-white mb-2">{{ category.name }}</h3>
        <p class="text-white/70 text-sm">{{ category.description }}</p>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 mt-4">
          <div
            *ngFor="let library of category.libraries; trackBy: trackById"
            class="bg-black/30 backdrop-blur rounded-xl p-5 border border-white/10"
          >
            <h4 class="text-lg font-semibold text-white">{{ library.name }}</h4>
            <p class="text-sm text-white/70">{{ library.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
