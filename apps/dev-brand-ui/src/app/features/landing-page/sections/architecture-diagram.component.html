<section
  class="w-full min-h-screen bg-gradient-to-br from-slate-800 via-blue-900 to-indigo-900 relative overflow-auto"
>
  <div #architectureCanvas class="absolute inset-0 opacity-20"></div>
  <div class="relative z-10 p-8">
    <div class="text-center mb-12">
      <h2 class="text-4xl font-bold text-white">Architecture Deep Dive</h2>
      <p class="text-lg text-white/80">
        Sophisticated {{ totalLayers }}-layer dependency architecture
      </p>
    </div>

    <div class="max-w-7xl mx-auto space-y-6">
      <div
        *ngFor="let layer of architectureLayers; trackBy: trackByLevel"
        class="bg-black/20 backdrop-blur-lg rounded-2xl border border-white/10 p-6"
      >
        <h3 class="text-2xl font-bold text-white mb-1">{{ layer.name }}</h3>
        <p class="text-white/70 text-sm">{{ layer.description }}</p>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 mt-4">
          <div
            *ngFor="
              let component of layer.components;
              trackBy: trackByComponentId
            "
            class="bg-black/30 backdrop-blur rounded-xl p-4 border border-white/10"
          >
            <h4 class="text-lg font-semibold text-white">
              {{ component.name }}
            </h4>
            <p class="text-sm text-white/70">{{ component.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
