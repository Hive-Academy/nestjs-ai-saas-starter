<div class="min-h-screen bg-gradient-to-br from-blue-900 via-purple-900 to-indigo-900 text-white p-5 font-sans">
  <!-- Header -->
  <div class="text-center mb-10">
    <h1 class="text-5xl font-extrabold mb-2.5 drop-shadow-lg">🐝 Multi-Agent Coordination Patterns</h1>
    <p class="text-lg opacity-90 mb-8">
      Explore the power of declarative agent coordination with real-time demonstrations
    </p>

    <brand-pattern-selector
      [patterns]="availablePatterns()"
      [selectedPattern]="selectedPattern()"
      (patternSelected)="onPatternSelected($event)"
    ></brand-pattern-selector>

    <brand-agent-selection-panel
      [agents]="availableAgents()"
      [selectedAgents]="selectedAgents()"
      (agentToggled)="onAgentToggled($event)"
    ></brand-agent-selection-panel>

    <brand-search-demo
      [demonstration]="searchDemonstration()"
      [isExpanded]="showSearchSection()"
      (searchExecuted)="onSearchExecuted($event)"
      (expandedToggled)="onSearchToggled()"
    ></brand-search-demo>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-[1fr_2fr] gap-8 max-w-7xl mx-auto items-start">
    <brand-configuration-panel
      [selectedPatternInfo]="selectedPatternInfo()"
      [executionStatus]="executionStatus()"
      [isExecuting]="isExecuting()"
      (configurationExecuted)="onConfigurationExecuted($event)"
    ></brand-configuration-panel>

    <brand-visualization-panel
      [visualizationMode]="visualizationMode()"
      [currentExecution]="currentExecution()"
      [isExecuting]="isExecuting()"
      [executionSteps]="executionSteps()"
      [serviceCoordination]="serviceCoordination()"
      [selectedPattern]="selectedPattern()"
    ></brand-visualization-panel>
  </div>

  <brand-streaming-output
    [isExecuting]="isExecuting()"
    [streamingOutput]="streamingOutput()"
  ></brand-streaming-output>

  <brand-execution-results
    [execution]="currentExecution()"
  ></brand-execution-results>

  <brand-websocket-status
    [status]="wsService.status()"
  ></brand-websocket-status>
</div>
