# Development services only (databases)
# Run API locally with: nx serve agent-api

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: hive-academy-neo4j-dev
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # IMPORTANT: Password is set ONLY on first initialization (when volume is created)
      # If auth fails, run: docker compose down -v && docker compose up -d
      - NEO4J_AUTH=neo4j/neogma-password
      - NEO4J_PLUGINS=["graph-data-science"]
      # Disable encryption for local development (Neo4j 5.x requires explicit config)
      - NEO4J_server_bolt_tls__level=DISABLED
    volumes:
      - neo4j-data:/data/neo4j
    networks:
      - hive-academy-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: hive-academy-chromadb-dev
    ports:
      - "8000:8000"
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - PERSIST_DIRECTORY=/data/chromadb
      - ANONYMIZED_TELEMETRY=false
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
      - IS_PERSISTENT=TRUE
    volumes:
      - chromadb-data:/data/chromadb
    networks:
      - hive-academy-network

  redis:
    image: redis:latest
    container_name: hive-academy-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data/redis
    networks:
      - hive-academy-network

networks:
  hive-academy-network:
    driver: bridge

volumes:
  neo4j-data:
  chromadb-data:
  redis-data:
